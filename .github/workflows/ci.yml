name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tokens.css / tokens.generated.ts are gitignored; generate them before type-check and tests.
      - run: npm run tokens:sync
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      - run: npm run build
        env:
          # Dummy values: the build only needs them to exist; tests never use real credentials.
          VITE_SUPABASE_URL: http://supabase.test
          VITE_SUPABASE_PUBLISHABLE_KEY: test-key
